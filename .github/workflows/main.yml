name: Keep Business Pioneers Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping_site:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Frontend
        run: curl -s https://fullstack-pioneers.vercel.app/
      
      - name: Ping Supabase API
        run: curl -s https://tylyjpseiebnuxclsqat.supabase.co/rest/v1/
        
      - name: Log Success
        run: echo "Pings sent successfully to both Vercel and Supabase!"
